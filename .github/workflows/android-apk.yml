name: Android APK Build

on:
  workflow_dispatch:
  push:

jobs:
  build-debug-apk:
    name: Build WORLD ARENA Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 35 & Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Gradle Wrapper & Permissions
        run: |
          if [ ! -f android-project/gradlew ] || [ ! -f android-project/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle 8.9 wrapper in android-project/..."
            (cd android-project && gradle wrapper --gradle-version 8.9)
          fi
          chmod +x android-project/gradlew

      - name: Build Android Debug APK
        shell: bash
        run: |
          mkdir -p build-logs
          set -o pipefail
          cd android-project
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build-logs/apk-build.log

      - name: Verify Debug APK Exists
        run: |
          APK_PATH="android-project/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected debug APK was not found at $APK_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH"

      - name: Report Build Failure Diagnostics
        if: failure()
        run: |
          echo "::error::WORLD ARENA Android APK build failed. Check the Gradle output below and download the WORLD-ARENA-BUILD-LOGS artifact."
          if [ -f build-logs/apk-build.log ]; then
            tail -n 80 build-logs/apk-build.log
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WORLD-ARENA-DEBUG-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Preserve Build Logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WORLD-ARENA-BUILD-LOGS
          path: build-logs/apk-build.log
          if-no-files-found: ignore
          retention-days: 14
